  # ==========================================
  # SPA (Public Client): conformance additions
  # ==========================================

  - id: "spa_28_code_expired"
    type: "spa"
    description: "SPA: Fail token exchange with expired authorization code"
    client_id: "another-app"
    redirect_uri: "http://sample.another.example.com:9090/callback"
    username: "suzuki"
    password: "password"
    scope: "openid"
    sleep_before_exchange: 70 # auth code lifetime is 60s in main.rs
    expected_token_status: 400

  - id: "spa_29_default_scope"
    type: "spa"
    description: "SPA: Omitted scope falls back to client default_scope"
