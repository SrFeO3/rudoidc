  # ==========================================
  # CORS policy
  # ==========================================

  - id: "cors_01_allowed_discovery"
    type: "cors"
    description: "CORS: allowed origin is echoed on discovery"
    method: "GET"
    path: "/.well-known/openid-configuration"
    origin: "http://localhost:8080"
    expected_status: 200
    expect_acao: true

  - id: "cors_02_denied_discovery"
    type: "cors"
    description: "CORS: disallowed origin is rejected"
    method: "GET"
    path: "/.well-known/openid-configuration"
    origin: "http://evil.example.com"
    expected_status: 403

  - id: "cors_03_no_origin_passthrough"
    type: "cors"
    description: "CORS: requests without Origin pass through"
    method: "GET"
    path: "/.well-known/openid-configuration"
    omit_origin: true
    expected_status: 200

  - id: "cors_04_preflight_allowed"
    type: "cors"
    description: "CORS: preflight from allowed origin succeeds"
    method: "OPTIONS"
    path: "/api/token"
    origin: "http://localhost:8080"
    expected_status: 204
    preflight: true

  - id: "cors_05_preflight_denied"
    type: "cors"
    description: "CORS: preflight from disallowed origin is rejected"
    method: "OPTIONS"
    path: "/api/token"
    origin: "http://evil.example.com"
    expected_status: 403

  - id: "cors_06_jwks_ignores_origin"
    type: "cors"
    description: "CORS: JWKS is server-to-server (no CORS headers)"
    method: "GET"
    path: "/jwks.json"
    origin: "http://evil.example.com"
    expected_status: 200
    expect_acao: false
